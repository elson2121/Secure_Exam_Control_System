# SECS Default Configuration
application.name=SECS
application.version=1.0.0
application.theme=light

# Server Configuration
server.host=localhost
server.port=1099
server.timeout=30000
server.retry.attempts=3
server.retry.delay=1000

# Database Configuration
database.url=jdbc:h2:./data/secs;AUTO_SERVER=TRUE
database.username=sa
database.password=
database.pool.size=10

# UI Configuration
ui.animation.enabled=true
ui.tooltips.enabled=true
ui.confirm.exit=true

# Security Configuration
security.password.min.length=8
security.session.timeout=3600
security.max.login.attempts=5

# Logging Configuration
log.level=INFO
log.file.enabled=true
log.file.path=logs/secs.log
log.file.max.size=10MB
log.file.max.history=10

# Network Configuration
network.proxy.enabled=false
network.connect.timeout=10000
network.read.timeout=30000